<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .box{
            width: 300px;
            height: 300px;
            background-color: brown;
            transition-duration: 2s;
            transition-property: width;
            transition-delay: 1s;
            transition-timing-function: ease-in;
            
        }

        .box:hover{
            background-color: blue;
            width: 400px;
            height: 400px;
            border-radius: 10px;
            position: relative;
            left: 200px;
        }
    </style>
</head>
<body>
    <div class="box">

    </div>




</body>
</html>
